services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codeops}
      MYSQL_USER: ${MYSQL_USER:-codeops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codeops}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  llm-backend:
    build:
      context: ./llm-backend
      dockerfile: Dockerfile
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
    ports:
      - "${LLM_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/ai/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backened
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-codeops}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-codeops}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-codeops}
      CODEOPS_AI_URL: http://llm-backend:8090/api/ai/review
      CODEOPS_BOOTSTRAP_TOKEN: ${CODEOPS_BOOTSTRAP_TOKEN:?Set CODEOPS_BOOTSTRAP_TOKEN in .env before starting CodeOps.}
    depends_on:
      mysql:
        condition: service_healthy
      llm-backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      mysql:
        condition: service_healthy
      llm-backend:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mysql-data:
