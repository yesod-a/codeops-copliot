server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:codeops}
    password: ${SPRING_RABBITMQ_PASSWORD:codeops}
    publisher-confirm-type: correlated
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/codeops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:codeops}
    password: ${SPRING_DATASOURCE_PASSWORD:codeops}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

codeops:
  ai-url: ${CODEOPS_AI_URL:http://127.0.0.1:8090/api/ai/review}
  bootstrap-token: ${CODEOPS_BOOTSTRAP_TOKEN:change-me-in-production}
  observability:
    event-retention-days: ${CODEOPS_OBSERVABILITY_EVENT_RETENTION_DAYS:90}
    retention-cron: ${CODEOPS_OBSERVABILITY_RETENTION_CRON:0 30 2 * * *}
  review-queue:
    exchange: ${CODEOPS_REVIEW_QUEUE_EXCHANGE:codeops.review}
    execute-queue: ${CODEOPS_REVIEW_QUEUE_EXECUTE:codeops.review.execute}
    routing-key: ${CODEOPS_REVIEW_QUEUE_ROUTING_KEY:review.execute}
