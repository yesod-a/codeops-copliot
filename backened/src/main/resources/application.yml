server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/codeops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:codeops}
    password: ${SPRING_DATASOURCE_PASSWORD:codeops}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

codeops:
  ai-url: ${CODEOPS_AI_URL:http://127.0.0.1:8090/api/ai/review}
  bootstrap-token: ${CODEOPS_BOOTSTRAP_TOKEN:change-me-in-production}
